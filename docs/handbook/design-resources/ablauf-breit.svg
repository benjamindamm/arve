<text x="32" y="610" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Kontext: q=ALP · status=all. Projektname öffnet genau eine ID. Rückkehr fokussiert deren Link, sonst die Ergebnisüberschrift.</text>
