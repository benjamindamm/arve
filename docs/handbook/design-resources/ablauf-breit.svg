<text x="32" y="522" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">P-102</text>
<text x="216" y="524" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="600">Alpen Archiv</text>
