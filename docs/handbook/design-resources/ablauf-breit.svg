<text x="32" y="350" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Gleiche ID, gleicher Suchkontext. ID und Status sind keine Eingaben. Keine Zusatzregion für die drei Pflichtangaben.</text>
