<text x="16" y="150" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Projekt-ID: P-101 · Status: Aktiv</text>
<text x="16" y="194" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="600">Projektname (erforderlich)</text>
<rect x="16" y="208" width="320" height="44" fill="#FFFFFF" stroke="#737373" rx="8"/>
<text x="32" y="234" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="400">Bergblick</text>
<text x="16" y="274" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">1 bis 80 Zeichen. Leerzeichen am</text>
<text x="16" y="294" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Anfang und Ende werden entfernt.</text>
<rect x="16" y="324" width="320" height="44" fill="#171717" stroke="none" rx="8"/>
<text x="32" y="348" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="14" font-weight="600">Änderungen speichern</text>
<rect x="16" y="380" width="320" height="44" fill="#FFFFFF" stroke="#737373" rx="8"/>
<text x="32" y="404" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="600">Abbrechen</text>
<text x="16" y="474" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="600">Entwurfsnotiz</text>
<text x="16" y="494" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Ausgangswert: Alpen. Erst Absenden</text>
<text x="16" y="514" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">prüft. Bestätigung führt zum Detail;</text>
<text x="16" y="534" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">q/status bleiben erhalten.</text>
</g>
