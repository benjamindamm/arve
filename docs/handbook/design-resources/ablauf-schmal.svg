<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1596" viewBox="0 0 816 1596" role="img" aria-labelledby="title"><title id="title">Finden → Verstehen → Bearbeiten · schmal</title><rect width="100%" height="100%" fill="#F5F5F5"/><text x="32" y="44" font-family="Inter, sans-serif" font-size="24" font-weight="600">Finden → Verstehen → Bearbeiten · schmal</text><text x="32" y="76" font-family="Inter, sans-serif" font-size="14">Arve · shadcn · Pilot 0.1 · statische Gestaltung · Inter erforderlich</text>
<g id="finden" transform="translate(32 104)"><title>01 · Finden</title><rect width="352" height="840" fill="white"/>
<text x="16" y="64" fill="#171717" font-family="Inter, sans-serif" font-size="32" font-weight="600">Projekte</text>
<rect x="16" y="96" width="320" height="44" fill="#171717" stroke="none" rx="8"/>
<text x="32" y="120" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="14" font-weight="600">Projekt erstellen</text>
<text x="16" y="190" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="600">Projekte suchen</text>
<rect x="16" y="204" width="320" height="44" fill="#FFFFFF" stroke="#737373" rx="8"/>
<text x="32" y="230" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="400">ALP</text>
<text x="16" y="270" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="600">Status</text>
<rect x="16" y="284" width="320" height="44" fill="#FFFFFF" stroke="#737373" rx="8"/>
<text x="32" y="310" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="400">Alle</text>
<text x="16" y="350" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Suche und Filter wirken sofort</text>
<rect x="16" y="372" width="320" height="44" fill="#FFFFFF" stroke="#737373" rx="8"/>
<text x="32" y="396" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="600">Suche zurücksetzen</text>
<text x="16" y="476" fill="#171717" font-family="Inter, sans-serif" font-size="24" font-weight="600">2 Projekte</text>
<text x="16" y="524" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="600">Alpen</text>
<text x="16" y="546" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Projekt-ID: P-101</text>
<text x="16" y="566" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Status: Aktiv</text>
<text x="16" y="612" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="600">Alpen Archiv</text>
<text x="16" y="634" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Projekt-ID: P-102</text>
<text x="16" y="654" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="400">Status: Archiviert</text>
<text x="16" y="722" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="600">Entwurfsnotiz</text>
<text x="16" y="742" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Kontext: q=ALP · status=all.</text>
<text x="16" y="762" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Projektname öffnet genau eine ID.</text>
<text x="16" y="782" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Rückkehr fokussiert deren Link, sonst</text>
<text x="16" y="802" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">die Ergebnisüberschrift.</text>
</g>
<g id="detail" transform="translate(432 104)"><title>02 · Verstehen</title><rect width="352" height="448" fill="white"/>
<text x="16" y="46" fill="#171717" font-family="Inter, sans-serif" font-size="14" font-weight="600">← Zurück zu Projekten</text>
<text x="16" y="132" fill="#171717" font-family="Inter, sans-serif" font-size="32" font-weight="600">Alpen</text>
<text x="16" y="180" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="400">Projekt-ID: P-101</text>
<text x="16" y="204" fill="#171717" font-family="Inter, sans-serif" font-size="16" font-weight="400">Status: Aktiv</text>
<rect x="16" y="236" width="320" height="44" fill="#171717" stroke="none" rx="8"/>
<text x="32" y="260" fill="#FAFAFA" font-family="Inter, sans-serif" font-size="14" font-weight="600">Projekt bearbeiten</text>
<text x="16" y="330" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="600">Entwurfsnotiz</text>
<text x="16" y="350" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Gleiche ID, gleicher Suchkontext. ID</text>
<text x="16" y="370" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">und Status sind keine Eingaben. Keine</text>
<text x="16" y="390" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Zusatzregion für die drei</text>
<text x="16" y="410" fill="#525252" font-family="Inter, sans-serif" font-size="14" font-weight="400">Pflichtangaben.</text>
</g>
<g id="bearbeiten" transform="translate(32 992)"><title>03 · Bearbeiten</title><rect width="352" height="572" fill="white"/>
