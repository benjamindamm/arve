<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Vom Eingeben zur bestätigten Übermittlung</title><desc>Vorgeschlagener Ablauf · Formularverhalten ist kein Input-Zustandsautomat</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#737373" stroke-width="1.3"/></marker></defs><rect width="1000" height="620" fill="#fafafa"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" fill="#171717" font-weight="600">Vom Eingeben zur bestätigten Übermittlung</text><text x="36" y="80" font-size="18" fill="#525252" font-weight="400">Vorgeschlagener Ablauf · Formularverhalten ist kein Input-Zustandsautomat</text><rect x="36" y="136" width="208" height="100" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="56" y="172" font-size="17" fill="#737373" font-weight="400">01</text><text x="56" y="210" font-size="23" fill="#171717" font-weight="600">Eingeben</text><path d="M247 186 L269 186" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="276" y="136" width="208" height="100" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="296" y="172" font-size="17" fill="#737373" font-weight="400">02</text><text x="296" y="210" font-size="23" fill="#171717" font-weight="600">Absenden</text><path d="M487 186 L509 186" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="516" y="136" width="208" height="100" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="536" y="172" font-size="17" fill="#737373" font-weight="400">03</text><text x="536" y="210" font-size="23" fill="#171717" font-weight="600">Prüfen</text><path d="M727 186 L749 186" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="756" y="136" width="208" height="100" rx="10" fill="#f0f4f1" stroke="#d4d4d4"/><text x="776" y="172" font-size="17" fill="#737373" font-weight="400">04</text><text x="776" y="210" font-size="23" fill="#171717" font-weight="600">Bestätigen</text><path d="M620 240 L620 308" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="514" y="316" width="450" height="122" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="538" y="353" font-size="23" fill="#171717" font-weight="600">Angaben korrigieren</text><text x="538" y="389" font-size="19" fill="#171717" font-weight="400">Fehler zuordnen · Eingaben erhalten</text><path d="M514 377 H140 V244" stroke="#737373" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="36" y="487" font-size="21" fill="#171717" font-weight="600">Antwort unklar?</text><text x="36" y="522" font-size="20" fill="#171717" font-weight="400">Keine Erfolgsmeldung vor bestätigter Annahme.</text><text x="36" y="555" font-size="18" fill="#525252" font-weight="400">Ob gespeichert wurde und wie ein sicherer Wiederholungsversuch möglich ist,</text><text x="36" y="582" font-size="18" fill="#525252" font-weight="400">muss der Ablauf ausdrücklich klären. Ein Netzfehler ist kein Eingabefehler.</text></g></svg>