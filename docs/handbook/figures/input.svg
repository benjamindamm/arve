<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Ein Feld ist mehr als seine Eingabe</title><desc>Gestaltungsschema · unterstützende Feldtexte brauchen eigene Regeln</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#737373" stroke-width="1.3"/></marker></defs><rect width="1000" height="620" fill="#fafafa"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" fill="#171717" font-weight="600">Ein Feld ist mehr als seine Eingabe</text><text x="36" y="80" font-size="18" fill="#525252" font-weight="400">Gestaltungsschema · unterstützende Feldtexte brauchen eigene Regeln</text><rect x="36" y="112" width="928" height="280" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="64" y="153" font-size="20" fill="#171717" font-weight="600">Anatomie</text><text x="72" y="198" font-size="20" fill="#171717" font-weight="600">E-Mail-Adresse</text><rect x="72" y="215" width="390" height="52" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="88" y="249" font-size="20" fill="#737373" font-weight="400">name@beispiel.ch</text><text x="72" y="303" font-size="18" fill="#525252" font-weight="400">Für die Bestätigung deiner Eingabe.</text><path d="M470 190 L538 190" stroke="#737373" stroke-width="2" fill="none" /><text x="554" y="196" font-size="20" fill="#171717" font-weight="400">1  Label bleibt sichtbar</text><path d="M470 242 L538 242" stroke="#737373" stroke-width="2" fill="none" /><text x="554" y="248" font-size="20" fill="#171717" font-weight="400">2  Eingabe bleibt bearbeitbar</text><path d="M470 296 L538 296" stroke="#737373" stroke-width="2" fill="none" /><text x="554" y="302" font-size="20" fill="#171717" font-weight="400">3  Hilfe erklärt Zweck oder Format</text><text x="72" y="357" font-size="17" fill="#525252" font-weight="400">Schema: nicht massstabsgetreu, keine zusätzliche Komponentenvariante.</text><rect x="36" y="416"