<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Eine Aufgabe, klare Inhaltsbereiche</title><desc>Eigener Layoutvorschlag · 2:1 als Ausgangspunkt, nicht als starre Vorgabe</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#737373" stroke-width="1.3"/></marker></defs><rect width="1000" height="620" fill="#fafafa"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" fill="#171717" font-weight="600">Eine Aufgabe, klare Inhaltsbereiche</text><text x="36" y="80" font-size="18" fill="#525252" font-weight="400">Eigener Layoutvorschlag · 2:1 als Ausgangspunkt, nicht als starre Vorgabe</text><text x="36" y="124" font-size="20" fill="#171717" font-weight="600">Viel Platz</text><text x="694" y="124" font-size="20" fill="#171717" font-weight="600">Wenig Platz</text><rect x="36" y="145" width="610" height="54" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="55" y="178" font-size="19" fill="#171717" font-weight="400">1  Kontextnavigation</text><rect x="36" y="211" width="610" height="84" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="55" y="244" font-size="20" fill="#171717" font-weight="600">2  Titel, Status und Aktionen</text><rect x="36" y="311" width="392" height="188" rx="10" fill="#eef2ef" stroke="#d4d4d4"/><text x="56" y="349" font-size="21" fill="#171717" font-weight="600">3  Hauptinhalt</text><text x="56" y="388" font-size="18" fill="#525252" font-weight="400">2 Rasteranteile</text><rect x="444" y="311" width="202" height="188" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="460" y="349" font-size="20" fill="#171717" font-weight="600">4  Zusatzinfos</text><text x="460" y="388" font-size="18" fill="#525252" font-weight="400">1 Rasteranteil</text><rect x="694" y="145" width="270" height="74" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="712" y="188" font-size="19" fill="#171717" font-weight="400">1  Navigation</text><rect x="694" y="235" width="270" height="74" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="712" y="278" font-size="19" fill="#171717" font-weight="400">2  Titel und Aktionen</text><rect x="694" y="325" width="270" height="74" rx="10" fill="#eef2ef" stroke="#d4d4d4"/><text x="712" y="368" font-size="19" fill="#171717" font-weight="400">3  Hauptinhalt</text><rect x="694" y="415" width="270" height="74" rx="10" fill="#fff" stroke="#d4d4d4"/><text x="712" y="458" font-size="19" fill="#171717" font-weight="400">4  Zusatzinfos</text><text x="36" y="546" font-size="21" fill="#171717" font-weight="600">Lesereihenfolge 1 → 2 → 3 → 4 bleibt erhalten.</text><text x="36" y="582" font-size="18" fill="#525252" font-weight="400">Umbruch nach Inhalt. Zusatzinfos dürfen Pflichtinformationen nicht verdrängen.</text></g></svg>