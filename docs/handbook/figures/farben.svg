<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Farbrollen bleiben zusammen</title><desc>Aus lokalen Tokens erzeugt · keine Abbildung der aktuellen Portal-Styles</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#737373" stroke-width="1.3"/></marker></defs><rect width="1000" height="620" fill="#fafafa"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="28" fill="#171717" font-weight="600">Farbrollen bleiben zusammen</text><text x="36" y="80" font-size="18" fill="#525252" font-weight="400">Aus lokalen Tokens erzeugt · keine Abbildung der aktuellen Portal-Styles</text><rect x="36" y="112" width="450" height="358" rx="10" fill="#FFFFFF" stroke="#d4d4d4"/><text x="60" y="151" font-size="23" fill="#0A0A0A" font-weight="600">Helles Theme</text><text x="60" y="190" font-size="20" fill="#0A0A0A" font-weight="400">Text auf Grundfläche</text><text x="60" y="220" font-size="17" fill="#737373" font-weight="400">#0A0A0A auf #FFFFFF</text><rect x="60" y="250" width="402" height="68" rx="10" fill="#171717" stroke="#171717"/><text x="82" y="291" font-size="22" fill="#FAFAFA" font-weight="600">Primäre Aktion</text><text x="60" y="357" font-size="18" fill="#0A0A0A" font-weight="400">Fläche und Text als Paar wählen.</text><text x="60" y="389" font-size="18" fill="#0A0A0A" font-weight="400">Die Bedeutung bleibt im Theme gleich.</text><text x="60" y="439" font-size="17" fill="#737373" font-weight="400">#FAFAFA auf #171717</text><rect x="514" y="112" width="450" height="358" rx="10" fill="#0A0A0A" stroke="#d4d4d4"/><text x="538" y="151" font-size="23" fill="#FAFAFA" font-weight="600">Dunkles Theme</text><text x="538" y="190" font-size="20" fill="#FAFAFA" font-weight="400">Text auf Grundfläche</text><text x="538" y="220" font-size="17" fill="#A3A3A3" font-weight="400">#FAFAFA auf #0A0A0A</text><rect x="538" y="250" width="402" height="68" rx="10" fill="#E5E5E5" stroke="#E5E5E5"/><text x="560" y="291" font-size="22" fill="#171717" font-weight="600">Primäre Aktion</text><text x="538" y="357" font-size="18" fill="#FAFAFA" font-weight="400">Fläche und Text als Paar wählen.</text><text x="538" y="389" font-size="18" fill="#FAFAFA" font-weight="400">Die Bedeutung bleibt im Theme gleich.</text><text x="538" y="439" font-size="17" fill="#A3A3A3" font-weight="400">#171717 auf #E5E5E5</text><text x="36" y="521" font-size="19" fill="#171717" font-weight="600">Quelle: lokaler Token-Export · light / dark</text><text x="36" y="554" font-size="18" fill="#525252" font-weight="400">Gezeigt werden nur vorhandene Rollen. Fehler-, Erfolgs- und Warnfarben</text><text x="36" y="580" font-size="18" fill="#525252" font-weight="400">sind im Export noch nicht als vollständiges Statussystem definiert.</text></g></svg>