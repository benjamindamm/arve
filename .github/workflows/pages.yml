name: Publish handbook to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check progressive MCP reads and search
        run: npm run check:mcp:unit
      - uses: actions/configure-pages@v6.0.0
        id: pages
      - name: Check agent dialog and authoring skill access
        run: npm run build:mcp-apps && npm run check:agent-ui
      - name: Check editorial status and reference copies
        run: node --import tsx --test scripts/editorial.test.ts scripts/system-template.test.ts
      - name: Check foundation color scales and contrast
        run: node --import tsx scripts/check-foundation-colors.ts
      - name: Check handbook hierarchy and compatibility links
        run: npm run check:handbook-paths
      - name: Check component documentation reference
        run: npm run check:component-template
      - name: Check all component documentation
        run: npm run check:component-catalog
      - name: Build published snapshot without a database
        run: npm run build:static
        env:
          ARVE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npm run check:static
        env:
          ARVE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .runtime/static-site/out
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
