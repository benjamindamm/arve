<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title description">
  <title id="title">Projekt Sommerfest löschen?</title>
  <desc id="description">Statische Löschbestätigung über einem abgedunkelten Arbeitsbereich. Der Text erklärt den endgültigen Verlust. Abbrechen hat den Anfangsfokus; Projekt löschen bestätigt die Handlung.</desc>
  <rect width="400" height="280" rx="12" fill="#f4f4f5"/>
  <rect x="20" y="20" width="112" height="12" rx="4" fill="#d4d4d8"/>
  <rect x="20" y="48" width="360" height="56" rx="8" fill="#fff"/>
  <rect x="20" y="116" width="360" height="56" rx="8" fill="#fff"/>
  <rect width="400" height="280" rx="12" fill="#09090b" fill-opacity=".5"/>
  <rect x="24" y="40" width="352" height="200" rx="14" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="44" y="74" fill="#09090b" font-size="17" font-weight="600">Projekt Sommerfest löschen?</text>
    <g fill="#52525b" font-size="15">
      <text x="44" y="105">Das Projekt und seine Dateien werden</text>
      <text x="44" y="127">endgültig gelöscht. Diese Handlung</text>
      <text x="44" y="149">kann nicht rückgängig gemacht werden.</text>
    </g>
    <rect x="67" y="175" width="112" height="43" rx="9" fill="none" stroke="#71717a" stroke-width="2"/>
    <rect x="71" y="179" width="104" height="35" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <text x="123" y="201" fill="#09090b" font-size="15" text-anchor="middle">Abbrechen</text>
    <rect x="187" y="179" width="165" height="35" rx="6" fill="#b91c1c"/>
    <text x="269.5" y="201" fill="#fff" font-size="15" text-anchor="middle">Projekt löschen</text>
  </g>
</svg>
