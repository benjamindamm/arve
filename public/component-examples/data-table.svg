<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" aria-labelledby="title desc">
  <title id="title">Zahlungen vergleichen und nach E-Mail filtern</title>
  <desc id="desc">Eine Tabelle mit zwei von drei passenden Zahlungen. Nach E-Mail aufsteigend sortiert, erste Zeile ausgewählt. Status anzeigen ist aktiviert. Vorherige Seite ist deaktiviert, nächste Seite ist verfügbar.</desc>
  <rect width="680" height="356" rx="12" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#18181b">
    <text x="24" y="32" font-size="19" font-weight="600">Zahlungen</text>
    <text x="24" y="60" fill="#52525b">E-Mail filtern</text>
    <rect x="24" y="70" width="294" height="36" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <text x="36" y="93" fill="#71717a">E-Mail-Adresse eingeben</text>
    <rect x="454" y="80" width="16" height="16" rx="3" fill="#18181b"/>
    <path d="m458 88 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="480" y="93">Status anzeigen</text>
    <rect x="24" y="124" width="632" height="132" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <path d="M25 168h630M25 212h630" stroke="#e4e4e7"/>
    <path d="M25 169h630v42H25z" fill="#f4f4f5"/>
    <text x="38" y="151" fill="#52525b">Auswahl</text>
    <text x="122" y="151" font-weight="600">E-Mail</text>
    <path d="m181 151 0-11m-4 4 4-4 4 4" fill="none" stroke="#18181b" stroke-width="1.5"/>
    <text x="406" y="151" fill="#52525b">Status</text>
    <text x="638" y="151" text-anchor="end" fill="#52525b">Betrag (USD)</text>
    <rect x="53" y="181" width="16" height="16" rx="3" fill="#18181b"/>
    <path d="m57 189 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.8"/>
    <text x="122" y="195">anna@example.com</text>
    <text x="406" y="195">Ausstehend</text>
    <text x="638" y="195" text-anchor="end">100.00</text>
    <rect x="53" y="225" width="16" height="16" rx="3" fill="#fff" stroke="#a1a1aa"/>
    <text x="122" y="239">beat@example.com</text>
    <text x="406" y="239">Bezahlt</text>
    <text x="638" y="239" text-anchor="end">125.00</text>
    <text x="24" y="283" fill="#52525b">Aktuelle Zahlungen in US-Dollar</text>
    <text x="24" y="326" fill="#52525b">3 passende Zahlungen</text>
    <rect x="376" y="303" width="140" height="36" rx="6" fill="#f4f4f5" stroke="#e4e4e7"/>
    <text x="446" y="326" text-anchor="middle" fill="#a1a1aa">Vorherige Seite</text>
    <rect x="528" y="303" width="128" height="36" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <text x="592" y="326" text-anchor="middle">Nächste Seite</text>
  </g>
</svg>
