<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="otp-title otp-desc">
<title id="otp-title">Bestätigungscode eingeben</title>
<desc id="otp-desc">Sechs visuelle Zeichenplätze in zwei Dreiergruppen. Die ersten drei zeigen 482. Der vierte Platz ist aktiv. Darunter steht die ergänzende Aktion Code prüfen.</desc>
<rect width="400" height="240" rx="12" fill="#fafafa"/>
<rect x="16" y="16" width="368" height="208" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="36" y="49" font-size="18" font-weight="600">Bestätigungscode</text>
<text x="36" y="74" font-size="14" fill="#52525b">Gib die sechs Ziffern aus deiner</text>
<text x="36" y="93" font-size="14" fill="#52525b">Nachricht ein.</text>
<g fill="#fff" stroke="#d4d4d8">
<rect x="36" y="111" width="108" height="36" rx="6"/>
<path d="M72 111v36M108 111v36"/>
<rect x="184" y="111" width="108" height="36" rx="6"/>
<path d="M220 111v36M256 111v36"/>
</g>
<path d="M160 129h8" stroke="#71717a" stroke-width="2"/>
<rect x="182" y="109" width="40" height="40" rx="7" fill="none" stroke="#a1a1aa" stroke-width="2"/>
<path d="M202 120v18" stroke="#18181b" stroke-width="1.5"/>
<g font-size="18" text-anchor="middle"><text x="54" y="135">4</text><text x="90" y="135">8</text><text x="126" y="135">2</text></g>
<rect x="36" y="174" width="126" height="34" rx="6" fill="#18181b"/>
<text x="99" y="196" font-size="14" fill="#fafafa" text-anchor="middle">Code prüfen</text>
</g></svg>
