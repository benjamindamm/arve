<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="tabs-title tabs-desc">
  <title id="tabs-title">Ansichten eines Monatsberichts</title>
  <desc id="tabs-desc">Übersicht ist als Tab ausgewählt. Einzelheiten steht als zweite Ansicht bereit. Im sichtbaren Panel stehen 24 abgeschlossene und 3 offene Aufträge.</desc>
  <rect width="400" height="260" rx="12" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="24" y="35" font-size="18" font-weight="600">Monatsbericht</text>
    <text x="24" y="58" font-size="14" fill="#71717a">Oktober 2026 · Aufträge</text>
    <rect x="24" y="78" width="255" height="38" rx="10" fill="#e4e4e7"/>
    <rect x="28" y="82" width="109" height="30" rx="7" fill="#fff" stroke="#d4d4d8"/>
    <text x="82" y="102" text-anchor="middle" font-size="15" font-weight="600">Übersicht</text>
    <text x="208" y="102" text-anchor="middle" font-size="15" fill="#52525b">Einzelheiten</text>
    <rect x="24" y="132" width="352" height="104" rx="9" fill="#fff" stroke="#e4e4e7"/>
    <text x="40" y="158" font-size="15" font-weight="600">Auf einen Blick</text>
    <text x="40" y="189" font-size="22" font-weight="600">24</text>
    <text x="40" y="214" font-size="14" fill="#52525b">Abgeschlossen</text>
    <line x1="212" y1="174" x2="212" y2="218" stroke="#e4e4e7"/>
    <text x="236" y="189" font-size="22" font-weight="600">3</text>
    <text x="236" y="214" font-size="14" fill="#52525b">Offen</text>
  </g>
</svg>
