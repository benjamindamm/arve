<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="label-title label-desc">
<title id="label-title">Sichtbare Beschriftungen für Kontaktangaben</title>
<desc id="label-desc">E-Mail ist als Pflichtfeld beschriftet. Darunter steht ein separater Hilfetext. Das zweite Feld Telefon ist ausdrücklich optional.</desc>
<rect width="400" height="280" rx="12" fill="#fafafa"/>
<rect x="16" y="16" width="368" height="248" rx="10" fill="#fff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="36" y="49" font-size="18" font-weight="600">Kontaktangaben</text>
<text x="36" y="83" font-size="16" font-weight="600">E-Mail <tspan font-weight="400">(Pflichtfeld)</tspan></text>
<rect x="36" y="95" width="328" height="40" rx="6" fill="#fff" stroke="#d4d4d8"/>
<text x="48" y="121" font-size="16">lea@beispiel.ch</text>
<text x="36" y="156" font-size="14" fill="#52525b">Hier erhältst du die Bestätigung.</text>
<text x="36" y="194" font-size="16" font-weight="600">Telefon <tspan font-weight="400">(optional)</tspan></text>
<rect x="36" y="206" width="328" height="40" rx="6" fill="#fff" stroke="#d4d4d8"/>
</g>
</svg>
