<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Tastaturhilfe zum Speichern</title>
<desc id="desc">In einer Dokumentansicht steht neben Speichern die Tastenkombination Ctrl plus S. Ein Satz erklärt das gemeinsame Drücken. Statischer Entwurf für eine Anwendung mit diesem Kurzbefehl.</desc>
<rect width="400" height="240" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="37" font-size="18" font-weight="600">Dokument bearbeiten</text>
<rect x="24" y="56" width="352" height="160" rx="10" fill="#fff" stroke="#e4e4e7"/>
<text x="44" y="85" font-size="14" fill="#71717a">Tastaturhilfe</text>
<text x="44" y="124" font-size="16" font-weight="600">Speichern</text>
<rect x="248" y="102" width="51" height="30" rx="6" fill="#f4f4f5"/>
<text x="273.5" y="123" text-anchor="middle" font-size="16" fill="#52525b">Ctrl</text>
<text x="312" y="123" text-anchor="middle" font-size="16" fill="#71717a">+</text>
<rect x="326" y="102" width="30" height="30" rx="6" fill="#f4f4f5"/>
<text x="341" y="123" text-anchor="middle" font-size="16" fill="#52525b">S</text>
<path d="M44 148H356" stroke="#e4e4e7"/>
<text x="44" y="175" font-size="15" fill="#52525b">Halte Ctrl gedrückt und drücke S.</text>
<text x="44" y="198" font-size="14" fill="#71717a">Beispiel für eine eingerichtete Kombination</text>
</g></svg>
