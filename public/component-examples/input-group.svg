<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Eingabegruppen für Berichtsuche und Betrag</title>
<desc id="desc">Über der ersten Gruppe steht Bericht suchen. Im Rahmen stehen eine Lupe, der Eingabewert Jahresbericht und die Aktion Leeren. Unter der Beschriftung Betrag in CHF zeigt eine zweite Gruppe den Wert 1250 und den festen Zusatz CHF.</desc>
<rect width="400" height="240" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#18181b">
<text x="24" y="34" font-weight="600">Bericht suchen</text>
<rect x="24" y="46" width="352" height="42" rx="9" fill="#ffffff" stroke="#d4d4d8"/>
<g fill="none" stroke="#71717a" stroke-width="1.8"><circle cx="44" cy="65" r="6"/><path d="m48.5 69.5 5 5"/></g>
<text x="68" y="72">Jahresbericht</text>
<rect x="286" y="51" width="84" height="32" rx="6" fill="#f4f4f5"/>
<text x="328" y="72" text-anchor="middle" font-size="14">Leeren</text>
<text x="24" y="110" font-size="14" fill="#71717a">Gib einen Berichtstitel ein.</text>
<text x="24" y="151" font-weight="600">Betrag in CHF</text>
<rect x="24" y="163" width="352" height="42" rx="9" fill="#ffffff" stroke="#d4d4d8"/>
<text x="37" y="190">1250</text><text x="361" y="190" text-anchor="end" fill="#71717a">CHF</text>
<text x="24" y="226" font-size="14" fill="#71717a">Die Währung bleibt fest.</text>
</g></svg>
