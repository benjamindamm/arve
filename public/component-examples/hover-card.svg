<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Profilvorschau am Link Nora Keller</title>
<desc id="desc">In einer Projektübersicht steht Nora Keller als verlinkte Verantwortliche. Darunter zeigt eine geöffnete Karte ihre Rolle und ihren Aufgabenbereich. Der Link führt zum vollständigen Profil.</desc>
<rect width="400" height="240" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="32" font-size="14" fill="#71717a">PROJEKTÜBERSICHT</text>
<text x="24" y="62" font-size="18" font-weight="600">Kundenportal</text>
<text x="24" y="93" font-size="15" fill="#52525b">Verantwortlich:</text>
<text x="139" y="93" font-size="15" text-decoration="underline">Nora Keller</text>
<rect x="90" y="105" width="272" height="112" rx="10" fill="#fff" stroke="#d4d4d8"/>
<circle cx="122" cy="139" r="17" fill="#f4f4f5"/>
<text x="111" y="144" font-size="14" font-weight="600">NK</text>
<text x="151" y="135" font-size="16" font-weight="600">Nora Keller</text>
<text x="151" y="156" font-size="14" fill="#71717a">Projektleitung</text>
<text x="106" y="184" font-size="15">Koordiniert die Einführung</text>
<text x="106" y="204" font-size="15">des Kundenportals.</text>
</g>
</svg>
