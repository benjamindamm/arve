<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="title desc">
<title id="title">Anfragen nach Eingangskanal</title>
<desc id="desc">Radiale Balken, aussen nach innen: Portal 275, E-Mail 200, Telefon 187, Schalter 173, Brief 90. Gleiche Winkelskala von null bis 300 Anfragen. Die daneben stehenden Zahlen zeigen die exakten Werte.</desc>
<rect x="1" y="1" width="398" height="328" rx="12" fill="#fff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="32" font-size="18" font-weight="700">Anfragen nach Eingangskanal</text>
<text x="24" y="56" font-size="14" fill="#52525b">Berichtsmonat Oktober · Anzahl Anfragen</text>
<circle cx="102" cy="172" r="70" fill="none" stroke="#e4e4e7" stroke-width="9"/>
<circle cx="102" cy="172" r="70" fill="none" stroke="#3f3f46" stroke-width="9" stroke-dasharray="403.171057 439.822972" transform="rotate(-90 102 172)"/>
<circle cx="102" cy="172" r="57" fill="none" stroke="#e4e4e7" stroke-width="9"/>
<circle cx="102" cy="172" r="57" fill="none" stroke="#3f3f46" stroke-width="9" stroke-dasharray="238.761042 358.141563" transform="rotate(-90 102 172)"/>
<circle cx="102" cy="172" r="44" fill="none" stroke="#e4e4e7" stroke-width="9"/>
<circle cx="102" cy="172" r="44" fill="none" stroke="#3f3f46" stroke-width="9" stroke-dasharray="172.326829 276.460154" transform="rotate(-90 102 172)"/>
<circle cx="102" cy="172" r="31" fill="none" stroke="#e4e4e7" stroke-width="9"/>
<circle cx="102" cy="172" r="31" fill="none" stroke="#3f3f46" stroke-width="9" stroke-dasharray="112.322409 194.778745" transform="rotate(-90 102 172)"/>
<circle cx="102" cy="172" r="18" fill="none" stroke="#e4e4e7" stroke-width="9"/>
<circle cx="102" cy="172" r="18" fill="none" stroke="#3f3f46" stroke-width="9" stroke-dasharray="33.929201 113.097336" transform="rotate(-90 102 172)"/>
<text x="204" y="100" font-size="14" fill="#52525b">Aussen nach innen</text>
<text x="204" y="128" font-size="16">Portal</text><text x="374" y="128" font-size="16" text-anchor="end" font-weight="700">275</text>
<text x="204" y="155" font-size="16">E-Mail</text><text x="374" y="155" font-size="16" text-anchor="end" font-weight="700">200</text>
<text x="204" y="182" font-size="16">Telefon</text><text x="374" y="182" font-size="16" text-anchor="end" font-weight="700">187</text>
<text x="204" y="209" font-size="16">Schalter</text><text x="374" y="209" font-size="16" text-anchor="end" font-weight="700">173</text>
<text x="204" y="236" font-size="16">Brief</text><text x="374" y="236" font-size="16" text-anchor="end" font-weight="700">90</text>
<line x1="24" y1="264" x2="376" y2="264" stroke="#e4e4e7"/>
<text x="24" y="288" font-size="15" font-weight="700">Voller Kreis = 300 Anfragen</text>
<text x="24" y="312" font-size="14" fill="#52525b">Gleiche Winkelskala · exakte Werte rechts</text>
</g></svg>
