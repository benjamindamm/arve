<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" role="img" aria-labelledby="title desc">
  <title id="title">Eine Rückmeldung in zwei Absätzen</title>
  <desc id="desc">Ein beschriftetes mehrzeiliges Feld enthält eine Beobachtung und einen Verbesserungsvorschlag. Darunter stehen eine Hilfe und die separate Aktion Rückmeldung senden.</desc>
  <rect width="400" height="286" rx="16" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="24" y="36" font-size="16" font-weight="600">Was sollen wir verbessern?</text>
    <rect x="24" y="50" width="352" height="136" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
    <g font-size="16">
      <text x="36" y="77">Die Wegbeschreibung war unklar.</text>
      <text x="36" y="121">Ein Lageplan beim Eingang würde</text>
      <text x="36" y="145">mir helfen.</text>
    </g>
    <path d="M360 176l7-7m-2 7 2-2" fill="none" stroke="#a1a1aa" stroke-width="1.2"/>
    <text x="24" y="210" font-size="14" fill="#52525b">Beschreibe die Situation und deinen Vorschlag.</text>
    <rect x="24" y="232" width="194" height="34" rx="7" fill="#18181b"/>
    <text x="121" y="254" text-anchor="middle" font-size="15" fill="#ffffff">Rückmeldung senden</text>
  </g>
</svg>
