<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="title desc">
<title id="title">Bericht konfigurieren</title>
<desc id="desc">Die Datei bericht.json zeigt vier nummerierte JSON-Zeilen mit Sprache Deutsch und Ausgabe als PDF. Im Kopf steht ein Kopiersymbol. Darunter bleibt die Anleitung zum manuellen Kopieren sichtbar.</desc>
<rect width="400" height="270" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#18181b">
<text x="20" y="30" font-size="18" font-weight="600">Bericht konfigurieren</text>
<rect x="20" y="48" width="360" height="160" rx="16" fill="#f4f4f5"/>
<text x="36" y="77" font-size="15" font-weight="500">bericht.json</text>
<g transform="translate(342 61)" stroke="#3f3f46" stroke-width="1.5" fill="none"><rect x="5" y="5" width="12" height="14" rx="2"/><path d="M12 2H3a2 2 0 0 0-2 2v10"/></g>
<g font-family="ui-monospace,monospace" font-size="15">
<g fill="#71717a" text-anchor="end"><text x="48" y="108">1</text><text x="48" y="132">2</text><text x="48" y="156">3</text><text x="48" y="180">4</text></g>
<text x="68" y="108">{</text><text x="68" y="132">  "sprache": "de",</text><text x="68" y="156">  "format": "pdf"</text><text x="68" y="180">}</text>
</g>
<text x="20" y="235" font-size="14" fill="#52525b">Markiere den Code und kopiere ihn manuell,</text>
<text x="20" y="255" font-size="14" fill="#52525b">falls die Kopieraktion nicht verfügbar ist.</text>
</g></svg>
