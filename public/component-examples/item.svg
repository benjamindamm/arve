<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Jahresbericht als Item mit separater Aktion</title>
<desc id="desc">Ein passiver umrandeter Eintrag enthält ein Dokumentensymbol, den Titel Jahresbericht 2025, Geschäftsjahr 2025, 24 Seiten und rechts die Aktion Öffnen.</desc>
<rect width="400" height="240" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="35" font-size="16" font-weight="600">Berichte</text>
<rect x="24" y="57" width="352" height="142" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
<g transform="translate(43 78)" fill="none" stroke="#52525b" stroke-width="1.7" stroke-linejoin="round"><path d="M2 0h13l7 7v22H2z"/><path d="M15 0v7h7M7 14h10M7 20h10"/></g>
<text x="81" y="90" font-size="16" font-weight="600">Jahresbericht 2025</text>
<text x="81" y="115" font-size="14" fill="#52525b">Geschäftsjahr 2025</text>
<text x="43" y="173" font-size="14" fill="#52525b">24 Seiten</text>
<rect x="268" y="145" width="88" height="34" rx="6" fill="#ffffff" stroke="#a1a1aa"/>
<text x="312" y="167" text-anchor="middle" font-size="14">Öffnen</text>
</g></svg>
