<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Wiedergabelautstärke einstellen</title>
  <desc id="desc">Ein einzelner Griff steht bei 40 Prozent. Die Schiene reicht von 0 bis 100 Prozent. Änderungen erfolgen in Schritten von 5 Prozentpunkten.</desc>
  <rect width="400" height="240" rx="12" fill="#fafafa"/>
  <rect x="20" y="24" width="360" height="192" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="40" y="62" font-size="16" font-weight="600">Wiedergabelautstärke</text>
    <text x="360" y="62" font-size="16" text-anchor="end" font-weight="600">40 %</text>
    <rect x="40" y="103" width="320" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="40" y="103" width="129" height="6" rx="3" fill="#18181b"/>
    <circle cx="169" cy="106" r="9" fill="#fff" stroke="#71717a" stroke-width="1.5"/>
    <text x="40" y="144" font-size="14" fill="#52525b">0 %</text>
    <text x="360" y="144" font-size="14" fill="#52525b" text-anchor="end">100 %</text>
    <text x="40" y="187" font-size="14" fill="#52525b">In Schritten von 5 Prozentpunkten</text>
  </g>
</svg>
