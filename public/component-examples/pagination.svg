<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Belegarchiv auf Seite 2 von 3</title>
  <desc id="desc">Zwei Belege stehen über einer Seitennavigation. Zurück und Weiter umgeben die Seitenzahlen 1, 2 und 3. Die aktuelle Seite 2 hat einen Rahmen.</desc>
  <rect width="400" height="260" rx="12" fill="#fafafa"/>
  <rect x="16" y="16" width="368" height="228" rx="10" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="32" y="44" font-size="18" font-weight="600">Belegarchiv</text>
    <text x="32" y="68" font-size="14" fill="#52525b">Seite 2 von 3</text>
    <path d="M32 82H368M32 126H368M32 170H368" stroke="#e4e4e7"/>
    <text x="32" y="110" font-size="15">Büromaterial</text>
    <text x="368" y="110" font-size="14" text-anchor="end" fill="#52525b">12.11.2026</text>
    <text x="32" y="154" font-size="15">Bahnfahrt Bern</text>
    <text x="368" y="154" font-size="14" text-anchor="end" fill="#52525b">09.11.2026</text>
    <path d="m42 201-5 5 5 5m317-10 5 5-5 5" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="51" y="211" font-size="15">Zurück</text>
    <text x="145" y="211" font-size="15" text-anchor="middle">1</text>
    <rect x="170" y="190" width="32" height="32" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <text x="186" y="211" font-size="15" text-anchor="middle" font-weight="600">2</text>
    <text x="227" y="211" font-size="15" text-anchor="middle">3</text>
    <text x="295" y="211" font-size="15">Weiter</text>
  </g>
</svg>
