<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
  <title id="title">Desktop-Besucher von Januar bis Juni</title>
  <desc id="desc">Liniendiagramm mit linearer Skala von 0 bis 400 und vollständiger Datentabelle. Januar 186, Februar 305, März 237, April 73, Mai 209, Juni 214. Höchster Wert im Februar, tiefster im April. Gerade Verbindungen sind keine gemessenen Zwischenwerte.</desc>
  <rect x="1" y="1" width="398" height="498" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
    <text x="22" y="32" font-size="18" font-weight="600">Desktop-Besucher</text>
    <text x="22" y="56" font-size="14" fill="#52525b">Januar bis Juni · Anzahl pro Monat</text>
    <text x="22" y="80" font-size="14">Tiefster Monatswert im April: 73</text>
    <g stroke="#e4e4e7" stroke-width="1">
      <path d="M54 110H370 M54 142H370 M54 174H370 M54 206H370 M54 238H370"/>
    </g>
    <g font-size="14" fill="#71717a" text-anchor="end">
      <text x="45" y="115">400</text><text x="45" y="147">300</text><text x="45" y="179">200</text><text x="45" y="211">100</text><text x="45" y="243">0</text>
    </g>
    <path d="M58 178.48L119 140.4L180 162.16L241 214.64L302 171.12L363 169.52" fill="none" stroke="#27272a" stroke-width="2.5" stroke-linejoin="round"/>
    <g font-size="14" fill="#52525b" text-anchor="middle">
      <text x="58" y="260">Jan</text><text x="119" y="260">Feb</text><text x="180" y="260">Mär</text><text x="241" y="260">Apr</text><text x="302" y="260">Mai</text><text x="363" y="260">Jun</text>
    </g>
    <line x1="22" y1="283" x2="43" y2="283" stroke="#27272a" stroke-width="2.5"/>
    <text x="52" y="288" font-size="14">Desktop · Verbindungen zur Orientierung</text>
    <rect x="22" y="306" width="356" height="26" rx="3" fill="#f4f4f5"/>
    <g font-size="14">
      <text x="32" y="324" font-weight="600">Monat</text><text x="368" y="324" font-weight="600" text-anchor="end">Desktop (Anzahl)</text>
      <text x="32" y="350">Januar</text><text x="368" y="350" text-anchor="end">186</text>
      <text x="32" y="376">Februar</text><text x="368" y="376" text-anchor="end">305</text>
      <text x="32" y="402">März</text><text x="368" y="402" text-anchor="end">237</text>
      <text x="32" y="428">April</text><text x="368" y="428" text-anchor="end">73</text>
      <text x="32" y="454">Mai</text><text x="368" y="454" text-anchor="end">209</text>
      <text x="32" y="480">Juni</text><text x="368" y="480" text-anchor="end">214</text>
    </g>
    <path d="M22 358H378 M22 384H378 M22 410H378 M22 436H378 M22 462H378" stroke="#e4e4e7"/>
  </g>
</svg>
