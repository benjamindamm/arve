<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280" role="img" aria-labelledby="collapsible-title collapsible-desc">
  <title id="collapsible-title">Ergänzende Projektdetails</title>
  <desc id="collapsible-desc">Die Projektübersicht Quartiergarten zeigt den Status In Planung. Darunter ist der Bereich Projektdetails geöffnet. Er enthält Standort Nordhof und Ansprechperson Mara Keller.</desc>
  <rect width="400" height="280" fill="#fafafa"/>
  <rect x="24" y="24" width="352" height="232" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#18181b">
    <text x="44" y="58" font-size="19" font-weight="600">Quartiergarten</text>
    <text x="44" y="84" font-size="14" fill="#71717a">In Planung</text>
    <line x1="44" y1="104" x2="356" y2="104" stroke="#e4e4e7"/>
    <text x="60" y="133" font-size="16" font-weight="500">Projektdetails</text>
    <text x="44" y="172" font-size="14" fill="#71717a">Standort</text>
    <text x="44" y="193" font-size="16">Nordhof</text>
    <text x="44" y="220" font-size="14" fill="#71717a">Ansprechperson</text>
    <text x="44" y="241" font-size="16">Mara Keller</text>
  </g>
</svg>
