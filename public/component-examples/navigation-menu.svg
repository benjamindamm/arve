<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Navigation mit aufgeklappten Berichten</title>
  <desc id="desc">Übersicht ist die aktuelle Seite. Der separate Öffner Berichte zeigt Umsatzbericht und Kostenbericht mit kurzen Beschreibungen.</desc>
  <rect width="400" height="260" rx="12" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="24" y="29" font-size="14" fill="#52525b">Hauptnavigation</text>
    <rect x="24" y="42" width="104" height="36" rx="10" fill="#e4e4e7"/>
    <text x="38" y="65" font-size="16" font-weight="600">Übersicht</text>
    <path d="M39 72h73" stroke="#18181b" stroke-width="1.5"/>
    <rect x="140" y="42" width="112" height="36" rx="10" fill="#f0f0f1"/>
    <text x="154" y="65" font-size="16" font-weight="600">Berichte</text>
    <path d="m230 63 5-5 5 5" fill="none" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="90" width="352" height="142" rx="12" fill="#fff" stroke="#d4d4d8"/>
    <text x="44" y="121" font-size="16" font-weight="600">Umsatzbericht</text>
    <text x="44" y="144" font-size="14" fill="#52525b">Einnahmen im Zeitverlauf ansehen</text>
    <path d="M44 158h312" stroke="#f0f0f1"/>
    <text x="44" y="184" font-size="16" font-weight="600">Kostenbericht</text>
    <text x="44" y="207" font-size="14" fill="#52525b">Betriebsausgaben vergleichen</text>
  </g>
</svg>
