<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="toast-title toast-desc">
<title id="toast-title">Notiz archiviert mit Rückgängig-Aktion</title>
<desc id="toast-desc">Ein Archiveintrag bleibt im Hintergrund sichtbar. Ein aufgeklappter Toast bestätigt die Archivierung, nennt das Archiv als Ablageort und bietet Rückgängig sowie Schliessen an.</desc>
<rect width="400" height="260" rx="12" fill="#fafafa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
<text x="24" y="36" font-size="18" font-weight="600">Archiv</text>
<rect x="24" y="52" width="352" height="66" rx="8" fill="#fff" stroke="#e4e4e7"/>
<path d="M42 72h16v22H42z M46 78h8 M46 84h8" fill="none" stroke="#71717a" stroke-width="1.5"/>
<text x="70" y="79" font-size="16" font-weight="600">Sitzungsnotiz</text>
<text x="70" y="101" font-size="14" fill="#71717a">Archiviert · heute, 10:24</text>
<rect x="16" y="148" width="368" height="96" rx="18" fill="#18181b" opacity=".05"/>
<rect x="16" y="144" width="368" height="96" rx="18" fill="#fff" stroke="#d4d4d8"/>
<text x="32" y="183" font-size="16" font-weight="600">Notiz archiviert</text>
<text x="32" y="207" font-size="14" fill="#71717a">Im Archiv verfügbar.</text>
<rect x="225" y="173" width="104" height="36" rx="7" fill="#fff" stroke="#d4d4d8"/>
<text x="277" y="196" text-anchor="middle" font-size="14" font-weight="600">Rückgängig</text>
<path d="m346 185 12 12 m0-12-12 12" fill="none" stroke="#71717a" stroke-width="1.7" stroke-linecap="round"/>
</g>
</svg>
