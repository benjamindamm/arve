<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title description">
<title id="title">Fragen zum Kursbesuch</title><desc id="description">Drei Fragen in einer Gruppe. Die Frage nach dem Material ist geöffnet und nennt Notizbuch und Trinkflasche. Anreise und Abmeldung sind geschlossen.</desc>
<rect width="400" height="280" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="36" font-size="18" font-weight="700">Vor dem Kursbesuch</text>
<text x="24" y="74" font-size="16" font-weight="600">Was soll ich mitbringen?</text>
<path d="m354 73 6-6 6 6" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="106" font-size="16" fill="#52525b">Bitte bring ein Notizbuch und</text>
<text x="24" y="130" font-size="16" fill="#52525b">eine Trinkflasche mit.</text>
<path d="M24 151H376" stroke="#d4d4d8"/>
<text x="24" y="184" font-size="16" font-weight="600">Wie erreiche ich den Kursort?</text>
<path d="m354 176 6 6 6-6" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M24 204H376" stroke="#d4d4d8"/>
<text x="24" y="237" font-size="16" font-weight="600">Wie kann ich mich abmelden?</text>
<path d="m354 229 6 6 6-6" fill="none" stroke="#52525b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M24 257H376" stroke="#d4d4d8"/>
</g></svg>
