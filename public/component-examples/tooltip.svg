<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Dokument speichern mit ergänzendem Tooltip</title>
  <desc id="desc">Eine Karte für die Projektnotizen zeigt eine fokussierte Schaltfläche mit Speichersymbol. Darüber steht Dokument speichern. Der dauerhafte Hinweis Speichert im aktuellen Projekt bleibt unter der Karte sichtbar.</desc>
  <rect width="400" height="240" rx="12" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <rect x="28" y="96" width="344" height="88" rx="10" fill="#fff" stroke="#e4e4e7"/>
    <text x="46" y="131" font-size="17" font-weight="600">Projektnotizen</text>
    <text x="46" y="157" font-size="14" fill="#71717a">Zuletzt bearbeitet: heute</text>
    <rect x="310" y="114" width="46" height="46" rx="9" fill="none" stroke="#71717a" stroke-width="2"/>
    <rect x="314" y="118" width="38" height="38" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <g fill="none" stroke="#27272a" stroke-width="1.8" stroke-linejoin="round">
      <path d="M324 127h15l4 4v16h-20v-20z"/>
      <path d="M328 127v7h10v-7M328 147v-8h10v8"/>
    </g>
    <rect x="174" y="49" width="192" height="39" rx="8" fill="#18181b"/>
    <path d="M327 88l6 6 6-6" fill="#18181b"/>
    <text x="270" y="74" text-anchor="middle" font-size="16" fill="#fafafa">Dokument speichern</text>
    <text x="28" y="213" font-size="15" fill="#52525b">Speichert im aktuellen Projekt.</text>
  </g>
</svg>
