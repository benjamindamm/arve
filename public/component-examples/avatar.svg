<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="avatar-title avatar-desc">
<title id="avatar-title">Ansprechperson und Team des Projektberichts</title>
<desc id="avatar-desc">Nora Keller wird durch NK und den Text Heute erreichbar identifiziert. Zwei überlappende Initialenbilder und die passive Angabe +3 stehen für fünf Personen im Team.</desc>
<rect width="400" height="260" rx="12" fill="#fafafa"/>
<rect x="16" y="16" width="368" height="228" rx="10" fill="#fff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="36" y="47" font-size="18" font-weight="600">Projektbericht</text>
<text x="36" y="73" font-size="14" fill="#71717a">Verantwortlich</text>
<circle cx="56" cy="110" r="20" fill="#f4f4f5" stroke="#e4e4e7"/>
<text x="56" y="115" font-size="14" text-anchor="middle">NK</text>
<circle cx="70" cy="124" r="6" fill="#18181b" stroke="#fff" stroke-width="2"/>
<text x="92" y="106" font-size="16" font-weight="600">Nora Keller</text>
<text x="92" y="129" font-size="14" fill="#52525b">Heute erreichbar</text>
<path d="M36 150H364" stroke="#e4e4e7"/>
<text x="36" y="179" font-size="14" fill="#71717a">Zusammenarbeit</text>
<circle cx="52" cy="211" r="16" fill="#f4f4f5" stroke="#fff" stroke-width="2"/>
<text x="52" y="216" font-size="14" text-anchor="middle">NK</text>
<circle cx="76" cy="211" r="16" fill="#e4e4e7" stroke="#fff" stroke-width="2"/>
<text x="76" y="216" font-size="14" text-anchor="middle">LB</text>
<circle cx="100" cy="211" r="16" fill="#f4f4f5" stroke="#fff" stroke-width="2"/>
<text x="100" y="216" font-size="14" text-anchor="middle">+3</text>
<text x="136" y="216" font-size="14" fill="#52525b">5 Personen im Team</text>
</g></svg>
