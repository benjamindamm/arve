<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Seitenpfad zum Schulhaus Nord</title>
  <desc id="desc">Oberhalb der Projektseite stehen Start und Bauprojekte als übergeordnete Ziele, gefolgt von der stärker betonten aktuellen Seite Schulhaus Nord.</desc>
  <rect width="400" height="240" rx="12" fill="#fafafa"/>
  <rect x="16" y="16" width="368" height="208" rx="8" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="32" y="51" fill="#71717a">Start</text>
    <path d="m73 41 5 5-5 5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="90" y="51" fill="#71717a">Bauprojekte</text>
    <path d="m175 41 5 5-5 5" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="192" y="51" fill="#18181b" font-weight="600">Schulhaus Nord</text>
    <path d="M32 71H368" stroke="#e4e4e7"/>
    <text x="32" y="106" font-size="24" font-weight="600" fill="#18181b">Schulhaus Nord</text>
    <text x="32" y="134" fill="#71717a">Neubau für zwölf Schulklassen</text>
    <rect x="32" y="158" width="336" height="46" rx="6" fill="#f4f4f5"/>
    <text x="46" y="187" fill="#52525b">Geplanter Bezug: Sommer 2028</text>
  </g>
</svg>
