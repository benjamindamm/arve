<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
<title id="title">Neue Nachrichten und eine Arbeitsnotiz im Verlauf</title><desc id="desc">Zwischen zwei Gesprächsbeiträgen steht das Label Ungelesene Nachrichten mit Linien links und rechts. Unter der neuen Nachricht steht ein Häkchen neben 4 Unterlagen geprüft.</desc>
<rect width="400" height="260" fill="#fafafa"/>
<rect x="16" y="16" width="368" height="228" rx="12" fill="#fff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" font-size="15" fill="#18181b">
<text x="32" y="46" font-weight="600">Planung der Schulung</text>
<text x="32" y="76" fill="#71717a">Lina · Gestern, 16:20</text>
<text x="32" y="100">Der Ablauf ist im Entwurf ergänzt.</text>
<path d="M32 128H91M309 128H368" stroke="#d4d4d8"/>
<text x="200" y="133" text-anchor="middle" fill="#71717a" font-size="14">Ungelesene Nachrichten</text>
<text x="32" y="166" fill="#71717a">Noah · Heute, 09:10</text>
<text x="32" y="190">Die Unterlagen sind jetzt vollständig.</text>
<path d="m34 218 4 4 9-10" fill="none" stroke="#71717a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="224" fill="#71717a" font-size="14">4 Unterlagen geprüft</text>
</g></svg>
