<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">Frühere Nachrichten zur Freigabe nachlesen</title>
<desc id="desc">Eine Projektbesprechung zeigt Beiträge von Lea und Nino. Unten im begrenzten Verlauf liegt ein runder Pfeil zum Gesprächsende. Ein Hinweis erklärt, dass neuere Beiträge weiter unten liegen.</desc>
<rect width="400" height="300" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="30" font-size="17" font-weight="700">Projektbesprechung</text>
<rect x="24" y="44" width="352" height="204" rx="12" fill="#fff" stroke="#d4d4d8"/>
<text x="42" y="74" font-size="15" font-weight="700">Lea</text>
<text x="42" y="98" font-size="15">Bitte prüfe die Freigabe bis</text>
<text x="42" y="119" font-size="15">Donnerstag um 14 Uhr.</text>
<line x1="42" y1="136" x2="346" y2="136" stroke="#e4e4e7"/>
<text x="42" y="160" font-size="15" font-weight="700">Nino</text>
<text x="42" y="184" font-size="15">Ich ergänze vorher die Zahlen.</text>
<rect x="360" y="65" width="4" height="90" rx="2" fill="#d4d4d8"/>
<circle cx="200" cy="220" r="15" fill="#fff" stroke="#a1a1aa"/>
<path d="m194 217 6 6 6-6" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="278" text-anchor="middle" font-size="14" fill="#52525b">Zum Ende · Neuere Beiträge weiter unten</text>
</g></svg>
