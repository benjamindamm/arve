<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Änderungen nicht gespeichert</title>
<desc id="desc">Ein Hinweis im Seiteninhalt erklärt einen Speicherfehler und bietet Erneut speichern an.</desc>
<rect width="400" height="240" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="24" y="35" font-size="16" font-weight="600">Projektangaben</text>
<rect x="24" y="53" width="352" height="164" rx="10" fill="#ffffff" stroke="#71717a"/>
<path d="M48 73 L58 91 H38 Z" fill="none" stroke="#3f3f46" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M48 79 V84 M48 87 V88" fill="none" stroke="#3f3f46" stroke-width="1.6"/>
<text x="70" y="87" font-size="16" font-weight="600">Änderungen nicht gespeichert</text>
<text x="70" y="116" font-size="15" fill="#52525b">Prüfe die Verbindung und</text>
<text x="70" y="139" font-size="15" fill="#52525b">versuche es erneut.</text>
<rect x="42" y="163" width="164" height="36" rx="6" fill="#18181b"/>
<text x="124" y="186" text-anchor="middle" font-size="15" fill="#ffffff">Erneut speichern</text>
</g>
</svg>
