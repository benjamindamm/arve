<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">Kontextaktionen für einen Quartalsbericht</title>
<desc id="desc">Die Berichtsvorschau hat einen sichtbaren Button Berichtsaktionen. Ein Kontextmenü zeigt Bericht speichern, die aktivierte Einstellung Raster anzeigen und Bericht löschen.</desc>
<rect width="400" height="300" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" font-size="15" fill="#18181b">
<text x="24" y="33" font-size="17" font-weight="600">Quartalsbericht</text>
<rect x="24" y="48" width="174" height="36" rx="8" fill="#fff" stroke="#d4d4d8"/>
<text x="37" y="71">Berichtsaktionen</text><path d="m178 63 4 4 4-4" fill="none" stroke="#52525b" stroke-width="1.5"/>
<rect x="24" y="98" width="352" height="174" rx="8" fill="#fff" stroke="#d4d4d8" stroke-dasharray="4 4"/>
<text x="40" y="125" fill="#52525b">Berichtsvorschau</text>
<rect x="40" y="146" width="46" height="96" rx="3" fill="#f4f4f5"/>
<path d="M52 166h22M52 179h22M52 192h16" stroke="#d4d4d8" stroke-width="3"/>
<rect x="108" y="137" width="249" height="121" rx="8" fill="#18181b" opacity=".06"/>
<rect x="104" y="133" width="249" height="121" rx="8" fill="#fff" stroke="#d4d4d8"/>
<rect x="109" y="138" width="239" height="31" rx="4" fill="#f4f4f5"/>
<text x="139" y="159">Bericht speichern</text>
<path d="m119 186 4 4 7-8" fill="none" stroke="#18181b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="139" y="192">Raster anzeigen</text>
<path d="M109 207h239" stroke="#e4e4e7"/>
<text x="139" y="235" fill="#b91c1c">Bericht löschen</text>
</g></svg>
