<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="badge-title badge-desc">
<title id="badge-title">Bearbeitungsstand von Dokumenten</title>
<desc id="badge-desc">Eine Liste zeigt Budgetplan mit dem dunklen Status In Prüfung und Sitzungsprotokoll mit dem hellen Status Freigegeben. Die Statusangaben sind keine Schaltflächen.</desc>
<rect width="400" height="240" rx="16" fill="#fafafa"/>
<rect x="20" y="20" width="360" height="200" rx="12" fill="#fff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="40" y="53" font-size="18" font-weight="600">Dokumente</text>
<text x="40" y="77" font-size="14" fill="#71717a">Aktueller Bearbeitungsstand</text>
<line x1="40" y1="92" x2="360" y2="92" stroke="#e4e4e7"/>
<text x="40" y="124" font-size="16">Budgetplan</text>
<rect x="246" y="104" width="114" height="28" rx="14" fill="#18181b"/>
<text x="303" y="123" text-anchor="middle" font-size="14" font-weight="600" fill="#fafafa">In Prüfung</text>
<line x1="40" y1="148" x2="360" y2="148" stroke="#f4f4f5"/>
<text x="40" y="182" font-size="16">Sitzungsprotokoll</text>
<rect x="246" y="162" width="114" height="28" rx="14" fill="#f4f4f5"/>
<text x="303" y="181" text-anchor="middle" font-size="14" font-weight="600">Freigegeben</text>
</g>
</svg>
