<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
<title id="title">Datei-Menü im Berichtseditor</title><desc id="desc">Über einem Quartalsbericht steht eine Menüleiste mit Datei, Bearbeiten und Ansicht. Datei ist geöffnet und bietet Bericht speichern, Exportieren als Untermenü sowie Bericht löschen an.</desc>
<rect width="400" height="260" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" font-size="15" fill="#18181b">
<rect x="16" y="16" width="368" height="228" rx="8" fill="#fff" stroke="#e4e4e7"/>
<text x="32" y="43" font-size="16" font-weight="600">Quartalsbericht</text>
<path d="M16 58H384" stroke="#e4e4e7"/>
<rect x="27" y="67" width="287" height="36" rx="7" fill="#fff" stroke="#e4e4e7"/>
<rect x="31" y="71" width="57" height="28" rx="4" fill="#f4f4f5"/>
<text x="40" y="90">Datei</text><text x="101" y="90">Bearbeiten</text><text x="208" y="90">Ansicht</text>
<rect x="278" y="125" width="78" height="8" rx="3" fill="#e4e4e7"/>
<rect x="278" y="145" width="60" height="8" rx="3" fill="#f4f4f5"/>
<rect x="278" y="165" width="78" height="8" rx="3" fill="#f4f4f5"/>
<rect x="28" y="111" width="230" height="119" rx="9" fill="#fff" stroke="#d4d4d8"/>
<rect x="33" y="116" width="220" height="31" rx="5" fill="#f4f4f5"/>
<text x="43" y="137">Bericht speichern</text>
<text x="43" y="172">Exportieren</text><path d="m235 161 5 5-5 5" fill="none" stroke="#71717a" stroke-width="1.5"/>
<path d="M33 185H253" stroke="#e4e4e7"/>
<text x="43" y="212" fill="#b91c1c">Bericht löschen</text>
</g></svg>
