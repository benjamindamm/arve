<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-labelledby="title desc">
<title id="title">Berichtserstellung mit Fehlerdetails</title>
<desc id="desc">Daten eingelesen in zwei Sekunden. Berechnung fehlgeschlagen, Details geöffnet: Keine Verbindung zur Datenquelle. Export wartet.</desc>
<rect width="400" height="272" rx="12" fill="#fafafa"/>
<rect x="16" y="16" width="368" height="240" rx="10" fill="white" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#18181b">
<text x="36" y="49" font-weight="600">Bericht erstellen</text>
<path d="m37 82 4 4 7-8" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="88" fill="#52525b">Daten eingelesen</text><text x="327" y="88" font-size="14" fill="#71717a">2 s</text>
<circle cx="43" cy="124" r="7" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
<path d="M43 120v5m0 2v1" stroke="#b91c1c" stroke-width="1.5"/>
<text x="60" y="130" fill="#b91c1c" font-weight="500">Berechnung fehlgeschlagen</text>
<path d="m348 122 5 5 5-5" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round"/>
<text x="60" y="159" fill="#52525b" font-size="14">Keine Verbindung zur Datenquelle.</text>
<text x="60" y="181" fill="#52525b" font-size="14">Prüfe die Verbindung vor dem Neustart.</text>
<circle cx="43" cy="218" r="6" fill="none" stroke="#a1a1aa" stroke-width="1.5"/>
<text x="60" y="224" fill="#71717a">Export wartet</text>
</g></svg>
