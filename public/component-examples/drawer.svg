<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="title desc">
<title id="title">Aufträge in einem unteren Drawer filtern</title><desc id="desc">Über einer abgedunkelten Auftragsliste liegt ein Drawer mit Griff, Titel, kurzem Hinweis, ausgewähltem Filter und zwei getrennten Aktionen.</desc>
<rect width="400" height="330" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#18181b"><text x="24" y="31" font-weight="600">Aufträge</text><rect x="246" y="13" width="130" height="34" rx="6" fill="#fff" stroke="#d4d4d8"/><text x="311" y="35" text-anchor="middle" font-size="14">Filter öffnen</text><text x="24" y="68" fill="#71717a">24 Aufträge</text></g>
<path d="M0 12Q0 0 12 0H388Q400 0 400 12V330H0Z" fill="#18181b" opacity=".3"/>
<path d="M0 101Q0 85 16 85H384Q400 85 400 101V330H0Z" fill="#fff" stroke="#d4d4d8"/>
<rect x="180" y="96" width="40" height="4" rx="2" fill="#a1a1aa"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#18181b"><text x="200" y="128" text-anchor="middle" font-weight="600">Aufträge filtern</text><text x="200" y="151" text-anchor="middle" font-size="14" fill="#71717a">Grenze die angezeigten Aufträge ein.</text>
<rect x="24" y="174" width="20" height="20" rx="4" fill="#18181b"/><path d="m29 184 4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="190">Nur offene Aufträge</text>
<rect x="24" y="217" width="352" height="39" rx="6" fill="#18181b"/><text x="200" y="242" text-anchor="middle" fill="#fff">12 Aufträge anzeigen</text>
<rect x="24" y="267" width="352" height="39" rx="6" fill="#fff" stroke="#d4d4d8"/><text x="200" y="292" text-anchor="middle">Schliessen</text></g></svg>
