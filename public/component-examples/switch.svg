<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Benachrichtigungen aus oder ein</title>
  <desc id="desc">Zwei statische Ansichten derselben Einstellung. Name und Erklärung bleiben gleich. Oben ist der Schalter aus, unten ein.</desc>
  <rect width="400" height="260" rx="12" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="24" y="34" font-size="18" font-weight="700">Nachrichten zu deinem Arbeitsbereich</text>
    <rect x="20" y="52" width="360" height="86" rx="9" fill="#fff" stroke="#e4e4e7"/>
    <text x="36" y="80" font-size="16" font-weight="700">Benachrichtigungen</text>
    <text x="36" y="104" font-size="14" fill="#52525b">Nachrichten zu neuen Aufgaben</text>
    <text x="280" y="126" font-size="14" fill="#52525b">Aus</text>
    <rect x="316" y="72" width="44" height="26" rx="13" fill="#d4d4d8"/>
    <circle cx="329" cy="85" r="10" fill="#fff"/>
    <rect x="20" y="152" width="360" height="86" rx="9" fill="#fff" stroke="#e4e4e7"/>
    <text x="36" y="180" font-size="16" font-weight="700">Benachrichtigungen</text>
    <text x="36" y="204" font-size="14" fill="#52525b">Nachrichten zu neuen Aufgaben</text>
    <text x="280" y="226" font-size="14" fill="#52525b">Ein</text>
    <rect x="316" y="172" width="44" height="26" rx="13" fill="#18181b"/>
    <circle cx="347" cy="185" r="10" fill="#fff"/>
  </g>
</svg>
