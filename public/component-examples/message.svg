<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 286" role="img" aria-labelledby="title desc">
<title id="title">Supportantwort mit Dokument</title><desc id="desc">Lea aus dem Support schreibt um 10:24, dass die Abrechnung geprüft ist. Darunter stehen ein PDF-Anhang und eine Kopieren-Aktion.</desc>
<rect width="400" height="286" rx="14" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="64" y="36" font-size="15" font-weight="600">Lea · Support</text><text x="326" y="36" font-size="14" fill="#71717a">10:24</text>
<rect x="64" y="52" width="312" height="82" rx="12" fill="#f0f0f1"/>
<text x="80" y="78" font-size="16"><tspan x="80">Die Abrechnung ist geprüft.</tspan><tspan x="80" dy="25">Hier ist die korrigierte Datei.</tspan></text>
<rect x="64" y="146" width="312" height="64" rx="9" fill="#fff" stroke="#d4d4d8"/>
<path d="M81 163h12l7 7v23H81z M93 163v8h7" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linejoin="round"/>
<text x="112" y="172" font-size="15" font-weight="600">Abrechnung.pdf</text><text x="112" y="194" font-size="14" fill="#71717a">PDF · 240 KB</text>
<rect x="64" y="224" width="112" height="34" rx="7" fill="#fff" stroke="#d4d4d8"/>
<text x="120" y="246" text-anchor="middle" font-size="15">Kopieren</text>
<circle cx="32" cy="190" r="16" fill="#e4e4e7"/><text x="32" y="195" text-anchor="middle" font-size="14" font-weight="600">LS</text>
</g></svg>
