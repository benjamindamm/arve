<title id="title">Besucher am Desktop von Januar bis Juni 2024</title>
<desc id="desc">Statische Illustration mit geradlinigem Flächenverlauf und Nullbasis. Januar 186, Februar 305, März 237, April 73, Mai 209 und Juni 214. Die Tabelle enthält alle Werte.</desc>
