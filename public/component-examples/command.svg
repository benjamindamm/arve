<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title description">
<title id="title">Berichtsbefehle suchen</title><desc id="description">Eingebettete Befehlsliste mit Suchfeld. Bericht speichern ist markiert, Bericht exportieren verfügbar und Bericht freigeben deaktiviert. Der Hinweis Command S registriert selbst keine Taste.</desc>
<rect width="400" height="260" fill="#fafafa"/>
<g font-family="system-ui, sans-serif" fill="#18181b">
<rect x="20" y="16" width="360" height="202" rx="14" fill="#fff" stroke="#d4d4d8"/>
<rect x="30" y="26" width="340" height="40" rx="7" fill="#fff" stroke="#a1a1aa"/>
<path d="m44 43 5 5 5-5" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="65" y="52" font-size="16" fill="#71717a">Befehl suchen …</text>
<text x="36" y="91" font-size="14" fill="#71717a">Bericht</text>
<rect x="28" y="102" width="344" height="34" rx="5" fill="#f4f4f5"/>
<text x="40" y="125" font-size="16">Bericht speichern</text><text x="354" y="125" font-size="14" text-anchor="end" fill="#71717a">⌘S</text>
<text x="40" y="161" font-size="16">Bericht exportieren</text>
<text x="40" y="197" font-size="16" fill="#a1a1aa">Bericht freigeben</text>
<text x="20" y="244" font-size="14" fill="#52525b">Markiert · noch nicht ausgeführt</text>
</g></svg>
