<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title desc">
<title id="title">Projekt umbenennen</title>
<desc id="desc">Statischer Dialogentwurf mit dem Projektnamen Sommerausstellung, einem Schliesskreuz und den Aktionen Abbrechen und Speichern.</desc>
<rect width="400" height="280" rx="12" fill="#d4d4d8"/>
<rect x="24" y="24" width="352" height="232" rx="14" fill="#ffffff" stroke="#a1a1aa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="44" y="57" font-size="18" font-weight="600">Projekt umbenennen</text>
<path d="m342 43 12 12m0-12-12 12" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round"/>
<text x="44" y="83" font-size="14" fill="#52525b">Ändere den Namen für dieses Projekt.</text>
<text x="44" y="120" font-size="14" font-weight="600">Projektname</text>
<rect x="44" y="132" width="312" height="40" rx="6" fill="#ffffff" stroke="#a1a1aa"/>
<text x="56" y="158" font-size="16">Sommerausstellung</text>
<rect x="128" y="196" width="108" height="40" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
<text x="182" y="221" font-size="14" text-anchor="middle">Abbrechen</text>
<rect x="246" y="196" width="110" height="40" rx="6" fill="#18181b"/>
<text x="301" y="221" font-size="14" text-anchor="middle" fill="#ffffff">Speichern</text>
</g>
</svg>
