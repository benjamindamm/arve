<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="checkbox-title checkbox-desc">
  <title id="checkbox-title">Inhalte für einen Export wählen</title>
  <desc id="checkbox-desc">Tabellen und Erläuterungen sind ausgewählt, Abbildungen nicht. Die Auswahl wird beim Absenden übernommen.</desc>
  <rect width="400" height="260" rx="12" fill="#fafafa"/>
  <rect x="16" y="16" width="368" height="228" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
    <text x="36" y="48" font-size="17" font-weight="600">Was soll der Export enthalten?</text>
    <text x="36" y="72" font-size="14" fill="#71717a">Mehrere Optionen sind möglich.</text>
    <rect x="36" y="95" width="18" height="18" rx="4" fill="#18181b"/>
    <path d="m40 104 3 3 7-7" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="109" font-size="16">Tabellen</text>
    <rect x="36" y="133" width="18" height="18" rx="4" fill="#ffffff" stroke="#a1a1aa"/>
    <text x="66" y="147" font-size="16">Abbildungen</text>
    <rect x="36" y="171" width="18" height="18" rx="4" fill="#18181b"/>
    <path d="m40 180 3 3 7-7" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="185" font-size="16">Erläuterungen</text>
    <text x="36" y="222" font-size="14" fill="#71717a">Wird beim Absenden übernommen.</text>
  </g>
</svg>
