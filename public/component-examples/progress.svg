<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Bericht hochladen: 40 Prozent</title>
  <desc id="desc">Eine Uploadanzeige zeigt 8 von 20 Megabyte übertragen. Der Balken ist zu zwei Fünfteln gefüllt.</desc>
  <rect width="400" height="240" fill="#fafafa"/>
  <rect x="20" y="38" width="360" height="164" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
    <text x="40" y="77" font-size="16" font-weight="600">Bericht hochladen</text>
    <text x="360" y="77" font-size="16" text-anchor="end">40 %</text>
    <rect x="40" y="102" width="320" height="8" rx="4" fill="#e4e4e7"/>
    <rect x="40" y="102" width="128" height="8" rx="4" fill="#18181b"/>
    <text x="40" y="145" font-size="15" fill="#52525b">8 von 20 MB übertragen</text>
    <text x="40" y="174" font-size="14" fill="#71717a">Jahresbericht.pdf</text>
  </g>
</svg>
