<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">Projekt bearbeiten im Sheet</title>
  <desc id="sheet-desc">Eine Dialogfläche liegt am rechten Rand über der abgedunkelten Projektübersicht. Sie enthält ein beschriftetes Feld mit Gartenplanung, einen Speichernknopf, Abbrechen und oben ein Schliesssymbol.</desc>
  <rect width="400" height="300" rx="8" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#525252">
    <text x="16" y="31" font-size="16" font-weight="bold">Projekte</text>
    <rect x="16" y="50" width="102" height="36" rx="5" fill="#fff" stroke="#d4d4d4"/>
    <text x="28" y="73">Bearbeiten</text>
    <path d="M16 111H112M16 131H98M16 170H111M16 190H84" stroke="#d4d4d4" stroke-width="7"/>
  </g>
  <path d="M8 0H130V300H8Q0 300 0 292V8Q0 0 8 0" fill="#171717" opacity="0.45"/>
  <path d="M130 0H392Q400 0 400 8V292Q400 300 392 300H130Z" fill="#fff"/>
  <path d="M130 0V300" stroke="#d4d4d4"/>
  <g font-family="Arial, sans-serif" fill="#171717">
    <text x="146" y="33" font-size="16" font-weight="bold">Projekt bearbeiten</text>
    <text x="146" y="58" font-size="14" fill="#525252">Passe den Projektnamen an.</text>
    <g aria-label="Schliessen">
      <rect x="364" y="12" width="28" height="28" rx="4" fill="#f5f5f5"/>
      <path d="M374 22L382 30M382 22L374 30" stroke="#525252" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="146" y="106" font-size="14" font-weight="bold">Projektname</text>
    <rect x="146" y="117" width="238" height="38" rx="5" fill="#fff" stroke="#a3a3a3"/>
    <text x="158" y="141" font-size="15">Gartenplanung</text>
    <rect x="150" y="199" width="230" height="38" rx="5" fill="#171717"/>
    <text x="265" y="223" text-anchor="middle" font-size="14" fill="#fff">Änderungen speichern</text>
    <rect x="150" y="246" width="230" height="34" rx="5" fill="#fff" stroke="#d4d4d4"/>
    <text x="265" y="268" text-anchor="middle" font-size="14">Abbrechen</text>
  </g>
</svg>
