<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
<title id="title">Rückfrage zum Bericht</title><desc id="desc">Lea: Der Bericht ist bereit. Darunter die Reaktion Danke mit Anzahl eins. Noah: Danke, ich prüfe ihn heute. Beide Namen sind im Text sichtbar.</desc>
<rect width="400" height="260" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#171717">
<text x="24" y="30" font-size="14" fill="#737373">Besprechung · Bericht</text>
<rect x="24" y="50" width="272" height="72" rx="22" fill="#f0f0f0"/>
<text x="40" y="77" font-size="15" font-weight="bold">Lea</text>
<text x="40" y="101" font-size="16">Der Bericht ist bereit.</text>
<rect x="174" y="108" width="110" height="30" rx="15" fill="#fff" stroke="#d4d4d4"/>
<text x="190" y="128" font-size="14">Danke · 1</text>
<rect x="87" y="164" width="289" height="72" rx="22" fill="#171717"/>
<text x="103" y="191" font-size="15" font-weight="bold" fill="#fafafa">Noah</text>
<text x="103" y="215" font-size="16" fill="#fafafa">Danke, ich prüfe ihn heute.</text>
</g></svg>
