<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title desc">
  <title id="title">Formatierungen im Berichtseditor</title>
  <desc id="desc">In der Gruppe Textformatierung sind Fett und Kursiv eingeschaltet. Ein Berichtstitel zeigt die Wirkung. Der einzelne Toggle Bericht anheften ist ausgeschaltet.</desc>
  <rect width="400" height="280" rx="16" fill="#fafafa"/>
  <rect x="16" y="16" width="368" height="248" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="32" y="44" font-size="16" font-weight="600">Textformatierung</text>
    <rect x="32" y="58" width="72" height="36" rx="9" fill="#e4e4e7" stroke="#d4d4d8"/>
    <text x="68" y="81" text-anchor="middle" font-size="16" font-weight="700">Fett</text>
    <rect x="112" y="58" width="88" height="36" rx="9" fill="#e4e4e7" stroke="#d4d4d8"/>
    <text x="156" y="81" text-anchor="middle" font-size="16" font-style="italic">Kursiv</text>
    <text x="32" y="119" font-size="14" fill="#52525b">2 Formatierungen eingeschaltet</text>
    <rect x="32" y="134" width="336" height="60" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="46" y="171" font-size="18" font-weight="700" font-style="italic">Rückblick auf das Quartal</text>
    <rect x="32" y="210" width="186" height="34" rx="9" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="125" y="232" text-anchor="middle" font-size="16">Bericht anheften</text>
    <text x="232" y="232" font-size="14" fill="#52525b">ausgeschaltet</text>
  </g>
</svg>
