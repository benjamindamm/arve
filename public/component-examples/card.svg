<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 264" role="img" aria-labelledby="title desc">
<title id="title">Projektkarte Bibliotheksumbau</title>
<desc id="desc">Der Kopf benennt das Projekt und den Stand der Vorbereitung. Darunter stehen drei offene Aufgaben und der nächste Termin am 26. November. Im Fuss ist Projekt öffnen als Link dargestellt.</desc>
<rect width="400" height="264" fill="#fafafa"/>
<rect x="24" y="20" width="352" height="224" rx="14" fill="#fff" stroke="#d4d4d8"/>
<path d="M25 184H375V230Q375 243 362 243H38Q25 243 25 230Z" fill="#f4f4f5"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="44" y="55" font-size="19" font-weight="600">Bibliotheksumbau</text>
<text x="44" y="80" font-size="15" fill="#52525b">Stand der Vorbereitung</text>
<text x="44" y="120" font-size="16" font-weight="600">3 Aufgaben offen</text>
<text x="44" y="146" font-size="15" fill="#52525b">Nächste Besprechung: 26. November</text>
<text x="44" y="219" font-size="16" text-decoration="underline">Projekt öffnen</text>
<path d="M174 213H189M184 208L189 213L184 218" fill="none" stroke="#18181b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</g></svg>
