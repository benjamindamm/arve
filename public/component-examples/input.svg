<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Ein Projekt benennen</title><desc id="desc">Projektname mit dem eingegebenen Wert Jahresbericht. Darunter steht die Hilfe: Ein Name, den dein Team wiedererkennt.</desc>
<rect width="400" height="240" rx="12" fill="#fafafa"/>
<rect x="20" y="24" width="360" height="192" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="40" y="60" font-size="18" font-weight="600">Projekt anlegen</text>
<text x="40" y="100" font-size="15" font-weight="600">Projektname</text>
<rect x="40" y="112" width="320" height="40" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
<text x="52" y="138" font-size="16">Jahresbericht</text>
<text x="40" y="177" font-size="14" fill="#52525b">Ein Name, den dein Team wiedererkennt.</text>
</g></svg>
