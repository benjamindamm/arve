<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Kontakte werden geladen</title>
  <desc id="desc">Eine Kontaktübersicht zeigt einen kleinen stillstehenden Kreisbogen und eine konkrete Lademeldung. Es wird kein Fortschrittswert angezeigt.</desc>
  <rect width="400" height="240" fill="#fafafa"/>
  <rect x="24" y="24" width="352" height="192" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="48" y="65" fill="#18181b" font-family="system-ui, sans-serif" font-size="20" font-weight="600">Kontakte</text>
  <path d="M24 86H376" stroke="#e4e4e7"/>
  <g transform="translate(50 115)" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round">
    <path d="M14.7 8a6.7 6.7 0 1 1-6.7-6.7"/>
  </g>
  <text x="78" y="130" fill="#18181b" font-family="system-ui, sans-serif" font-size="16">Kontakte werden geladen</text>
  <text x="48" y="176" fill="#71717a" font-family="system-ui, sans-serif" font-size="14">Die Übersicht erscheint hier.</text>
</svg>
