<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
<title id="title">Aktionen für den Monatsbericht</title>
<desc id="desc">Unter Monatsbericht Oktober stehen zwei gleichwertige, miteinander verbundene Schaltflächen: Speichern und Exportieren. Eine dünne Linie trennt die beiden Aktionen.</desc>
<rect width="400" height="240" rx="16" fill="#fafafa"/>
<rect x="20" y="20" width="360" height="200" rx="12" fill="#fff" stroke="#e4e4e7"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="40" y="57" font-size="18" font-weight="600">Monatsbericht Oktober</text>
<text x="40" y="86" font-size="14" fill="#71717a">Umsätze und offene Aufträge</text>
<path d="M40 106H360" stroke="#e4e4e7"/>
<text x="40" y="133" font-size="14" fill="#52525b">Aktionen für diesen Bericht</text>
<rect x="40" y="150" width="278" height="44" rx="10" fill="#fff" stroke="#d4d4d8"/>
<path d="M171 150V194" stroke="#d4d4d8"/>
<text x="105" y="178" font-size="16" text-anchor="middle">Speichern</text>
<text x="245" y="178" font-size="16" text-anchor="middle">Exportieren</text>
</g>
</svg>
