<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title desc">
<title id="title">Einen Abholort aus der Liste wählen</title>
<desc id="desc">Im Feld Abholort steht Bern. Darunter sind Bern Bahnhof und Bern Altstadt sichtbar. Bahnhof ist grau markiert, aber noch nicht ausgewählt.</desc>
<rect width="400" height="280" rx="12" fill="#fafafa"/>
<g font-family="Arial, sans-serif" fill="#18181b">
<text x="28" y="34" font-size="16" font-weight="600">Abholort</text>
<text x="28" y="57" font-size="14" fill="#52525b">Tippe einen Ort und wähle einen Standort.</text>
<rect x="27" y="73" width="346" height="42" rx="10" fill="white" stroke="#a1a1aa"/>
<rect x="30" y="76" width="340" height="36" rx="8" fill="none" stroke="#e4e4e7"/>
<text x="42" y="100" font-size="16">Bern</text>
<path d="m344 91 6 6 6-6" fill="none" stroke="#52525b" stroke-width="1.7" stroke-linecap="round"/>
<path d="M80 84v20" stroke="#18181b"/>
<rect x="28" y="121" width="344" height="94" rx="10" fill="white" stroke="#d4d4d8"/>
<rect x="33" y="126" width="334" height="40" rx="5" fill="#f4f4f5"/>
<text x="45" y="151" font-size="16">Bern · Bahnhof</text>
<text x="45" y="193" font-size="16">Bern · Altstadt</text>
<text x="28" y="244" font-size="14" fill="#52525b">Markierter Treffer · noch nicht ausgewählt</text>
</g></svg>
