<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Zwei Bereiche einer Übersicht</title>
  <desc id="desc">Kontaktperson Lea Meier mit ihrer E-Mail-Adresse. Eine horizontale Linie trennt den Kontakt von den Angaben zum Standardversand.</desc>
  <rect width="400" height="260" fill="#fafafa"/>
  <rect x="20" y="16" width="360" height="228" rx="10" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#18181b">
    <text x="40" y="46" font-size="16" font-weight="700">Bestellübersicht</text>
    <text x="40" y="78" font-weight="700">Kontakt</text>
    <text x="40" y="101">Lea Meier</text>
    <text x="40" y="123" fill="#52525b">lea.meier@example.ch</text>
    <path d="M40 146H360" stroke="#d4d4d8" stroke-width="1"/>
    <text x="40" y="176" font-weight="700">Versand</text>
    <text x="40" y="200">Standardversand</text>
    <text x="40" y="222" fill="#52525b">Lieferung in 2–3 Werktagen</text>
  </g>
</svg>
