<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Region wählen</title>
  <desc id="desc">Geschlossene native Einzelauswahl mit Label Region, ausgewähltem Wert Schweiz und Hinweis Wähle eine verfügbare Region.</desc>
  <rect width="400" height="240" fill="#fafafa"/>
  <rect x="24" y="28" width="352" height="184" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="48" y="69" font-size="16" font-weight="600">Region</text>
    <rect x="48" y="84" width="304" height="44" rx="8" fill="#ffffff" stroke="#a1a1aa"/>
    <text x="61" y="112" font-size="16">Schweiz</text>
    <path d="m325 103 5 5 5-5" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="158" font-size="15" fill="#52525b">Wähle eine verfügbare Region.</text>
    <text x="48" y="187" font-size="14" fill="#71717a">Eine Region ausgewählt</text>
  </g>
</svg>
