<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 398" role="img" aria-labelledby="title desc">
  <title id="title">Projektbericht einrichten: optionale Inhalte</title>
  <desc id="desc">Frage 2 von 3. Die Antwort Fortschritt ist ausgewählt, Risiken ist nicht ausgewählt. Darunter stehen Zurück, Überspringen und Weiter.</desc>
  <rect width="440" height="398" rx="12" fill="#fafafa"/>
  <rect x="16" y="16" width="408" height="366" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="36" y="46" font-size="16" font-weight="600">Projektbericht einrichten</text>
    <text x="36" y="74" font-size="14" fill="#71717a">Frage 2 von 3</text>
    <text x="36" y="107" font-size="18" font-weight="600">Welche Inhalte brauchst du?</text>
    <text x="36" y="132" font-size="14" fill="#52525b">Mehrere Antworten möglich.</text>
    <text x="36" y="152" font-size="14" fill="#52525b">Du kannst diese Frage überspringen.</text>
    <rect x="36" y="170" width="368" height="64" rx="10" fill="#f4f4f5" stroke="#a1a1aa"/>
    <rect x="52" y="193" width="18" height="18" rx="3" fill="#18181b"/>
    <path d="m56 202 3 3 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="208" font-size="16">Fortschritt</text>
    <rect x="36" y="244" width="368" height="64" rx="10" fill="#fff" stroke="#d4d4d8"/>
    <rect x="52" y="267" width="18" height="18" rx="3" fill="#fff" stroke="#a1a1aa"/>
    <text x="84" y="282" font-size="16">Risiken</text>
    <rect x="36" y="322" width="78" height="44" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <text x="75" y="350" font-size="14" text-anchor="middle">Zurück</text>
    <rect x="174" y="322" width="132" height="44" rx="6" fill="#fff" stroke="#d4d4d8"/>
    <text x="240" y="350" font-size="14" text-anchor="middle">Überspringen</text>
    <rect x="316" y="322" width="88" height="44" rx="6" fill="#18181b"/>
    <text x="360" y="350" font-size="14" fill="#fff" text-anchor="middle">Weiter</text>
  </g>
</svg>
