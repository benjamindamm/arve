<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-labelledby="title description">
<title id="title">Noch keine Dokumente</title>
<desc id="description">Ein leerer Dokumentbereich mit dekorativem Dokument-Symbol, Erklärung und einer zusätzlichen Aktion zum Hochladen.</desc>
<rect width="400" height="272" fill="#fff"/>
<rect x="16" y="16" width="368" height="240" rx="14" fill="#fff" stroke="#d4d4d8" stroke-dasharray="5 4"/>
<rect x="184" y="40" width="32" height="32" rx="10" fill="#f4f4f5"/>
<g fill="none" stroke="#52525b" stroke-width="1.5" stroke-linejoin="round"><path d="M195 48h6l4 4v12h-10z"/><path d="M201 48v5h4M198 57h4M198 60h4"/></g>
<g font-family="Arial, sans-serif" text-anchor="middle">
<text x="200" y="104" fill="#18181b" font-size="18" font-weight="600">Noch keine Dokumente</text>
<text x="200" y="133" fill="#52525b" font-size="15">Lade dein erstes Dokument hoch,</text>
<text x="200" y="155" fill="#52525b" font-size="15">um hier zu starten.</text>
<rect x="106" y="179" width="188" height="40" rx="7" fill="#18181b"/>
<text x="200" y="204" fill="#fafafa" font-size="15" font-weight="500">Dokument hochladen</text>
</g></svg>
