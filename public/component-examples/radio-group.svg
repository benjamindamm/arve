<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Eine Zustellart wählen</title>
  <desc id="desc">Die Gruppe fragt nach der Zustellart. Standardzustellung ist ausgewählt. Expresszustellung mit 12 Franken Aufpreis und Abholung sind nicht ausgewählt.</desc>
  <rect width="400" height="260" fill="#fafafa"/>
  <rect x="16" y="16" width="368" height="228" rx="12" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
    <text x="36" y="47" font-size="16" font-weight="600">Wie möchtest du die Lieferung</text>
    <text x="36" y="69" font-size="16" font-weight="600">erhalten?</text>
    <text x="36" y="97" font-size="14" fill="#71717a">Wähle eine Zustellart.</text>
    <circle cx="44" cy="128" r="8" fill="#18181b"/>
    <circle cx="44" cy="128" r="4" fill="#fafafa"/>
    <text x="60" y="133" font-size="16">Standardzustellung</text>
    <circle cx="44" cy="168" r="7.5" fill="#fff" stroke="#a1a1aa"/>
    <text x="60" y="173" font-size="16">Expresszustellung (+ CHF 12)</text>
    <circle cx="44" cy="208" r="7.5" fill="#fff" stroke="#a1a1aa"/>
    <text x="60" y="213" font-size="16">Abholung</text>
  </g>
</svg>
