<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" role="img" aria-labelledby="field-title field-desc">
  <title id="field-title">Kontaktangaben mit fehlerhafter E-Mail-Adresse</title>
  <desc id="field-desc">Unter der Gruppenlegende Kontaktangaben stehen das Label E-Mail-Adresse, die Eingabe lea@, ein Hinweis zur Bestätigung und die Fehlermeldung Ergänze die vollständige Adresse.</desc>
  <rect width="400" height="290" rx="12" fill="#fafafa"/>
  <rect x="16" y="16" width="368" height="258" rx="10" fill="#fff" stroke="#e4e4e7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
    <text x="36" y="52" font-size="18" font-weight="600">Kontaktangaben</text>
    <text x="36" y="89" font-size="16" font-weight="600">E-Mail-Adresse</text>
    <rect x="36" y="102" width="328" height="42" rx="6" fill="#fff" stroke="#b91c1c"/>
    <text x="49" y="129" font-size="16">lea@</text>
    <text x="36" y="171" font-size="15" fill="#52525b">An diese Adresse senden wir</text>
    <text x="36" y="192" font-size="15" fill="#52525b">deine Bestätigung.</text>
    <text x="36" y="230" font-size="15" fill="#b91c1c">Ergänze die vollständige Adresse.</text>
  </g>
</svg>
