<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">Kontakte werden geladen</title>
  <desc id="desc">Ein Bereich mit der Überschrift Kontakte und einer lesbaren Lademeldung. Zwei runde Porträtflächen und jeweils zwei graue Textbalken reservieren Platz für die späteren Einträge.</desc>
  <rect width="400" height="240" rx="12" fill="#fafafa"/>
  <rect x="20" y="16" width="360" height="208" rx="10" fill="#ffffff" stroke="#e4e4e7"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="48" font-size="18" font-weight="600" fill="#18181b">Kontakte</text>
    <text x="40" y="74" font-size="14" fill="#52525b">Kontakte werden geladen</text>
  </g>
  <g fill="#e4e4e7">
    <circle cx="60" cy="118" r="20"/>
    <rect x="96" y="100" width="188" height="16" rx="8"/>
    <rect x="96" y="124" width="132" height="16" rx="8"/>
    <circle cx="60" cy="182" r="20"/>
    <rect x="96" y="164" width="164" height="16" rx="8"/>
    <rect x="96" y="188" width="208" height="16" rx="8"/>
  </g>
</svg>
