<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-labelledby="title desc">
  <title id="title">Drei Berichtsvorschauen durchblättern</title>
  <desc id="desc">Die erste Vorschau Monatsübersicht enthält einen kurzen Beschreibungstext. Links ist Zurück deaktiviert, rechts ist Weiter verfügbar. Darunter steht Bericht 1 von 3.</desc>
  <rect width="400" height="260" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" fill="#18181b">
    <text x="24" y="34" font-size="18" font-weight="600">Berichtsvorschauen</text>
    <rect x="58" y="56" width="284" height="150" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
    <rect x="78" y="76" width="36" height="36" rx="7" fill="#f4f4f5"/>
    <path d="M89 85h10l5 5v14H89z M99 85v6h5 M93 96h7 M93 100h7" stroke="#52525b" fill="none" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="78" y="139" font-size="18" font-weight="600">Monatsübersicht</text>
    <text x="78" y="164" font-size="15" fill="#52525b">Erträge und Kosten im Mai</text>
    <text x="78" y="185" font-size="15" fill="#52525b">auf einen Blick.</text>
    <circle cx="30" cy="131" r="14" fill="#fafafa" stroke="#e4e4e7"/>
    <path d="m33 126-5 5 5 5" fill="none" stroke="#c4c4cc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="370" cy="131" r="14" fill="#ffffff" stroke="#a1a1aa"/>
    <path d="m367 126 5 5-5 5" fill="none" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="200" y="237" text-anchor="middle" font-size="15" fill="#52525b">Bericht 1 von 3</text>
  </g>
</svg>
