<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Projektaktivitäten im begrenzten Ausschnitt</title>
  <desc id="description">Eine Überschrift und ein Hinweis stehen über drei sichtbaren Aktivitäten. Die vertikale Scrollleiste rechts zeigt, dass weitere Einträge folgen.</desc>
  <rect width="400" height="260" rx="12" fill="#fafafa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#18181b">
    <text x="24" y="32" font-size="17" font-weight="600">Aktivitäten · Schulhaus West</text>
    <text x="24" y="57" font-size="14" fill="#52525b">Weitere Einträge durch Scrollen</text>
    <rect x="24.5" y="76.5" width="351" height="159" rx="8" fill="#fff" stroke="#d4d4d8"/>
    <text x="42" y="105" font-size="14" fill="#71717a">Heute · 10:40</text>
    <text x="42" y="126" font-size="16">Bauplan aktualisiert</text>
    <path d="M42 138H347" stroke="#e4e4e7"/>
    <text x="42" y="160" font-size="14" fill="#71717a">Heute · 09:15</text>
    <text x="42" y="181" font-size="16">Termin bestätigt</text>
    <path d="M42 193H347" stroke="#e4e4e7"/>
    <text x="42" y="219" font-size="16">Gestern · Kosten geprüft</text>
    <rect x="363" y="85" width="5" height="141" rx="2.5" fill="#f4f4f5"/>
    <rect x="363" y="85" width="5" height="49" rx="2.5" fill="#a1a1aa"/>
  </g>
</svg>
