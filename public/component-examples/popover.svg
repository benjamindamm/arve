<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="popover-title popover-desc">
  <title id="popover-title">Projektname im Popover ändern</title>
  <desc id="popover-desc">Ein geöffneter Zusatzbereich unter Projektname ändern zeigt das Feld Name mit Wochenbericht. Die Aktionen Schliessen und Speichern sind getrennt.</desc>
  <rect width="400" height="280" rx="12" fill="#fafafa"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#171717">
    <rect x="56" y="20" width="194" height="36" rx="7" fill="#fff" stroke="#d4d4d4"/>
    <text x="70" y="43">Projektname ändern</text>
    <path d="m228 35 5 5 5-5" fill="none" stroke="#525252" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="58" y="70" width="288" height="188" rx="10" fill="#e5e5e5" opacity=".45"/>
    <rect x="56" y="66" width="288" height="188" rx="10" fill="#fff" stroke="#d4d4d4"/>
    <text x="72" y="94" font-size="16" font-weight="600">Projektname</text>
    <text x="72" y="117" fill="#737373">Nur den Namen ändern.</text>
    <text x="72" y="146">Name</text>
    <rect x="72" y="156" width="256" height="34" rx="6" fill="#fff" stroke="#a3a3a3"/>
    <text x="83" y="178">Wochenbericht</text>
    <rect x="72" y="206" width="119" height="32" rx="6" fill="#fff" stroke="#d4d4d4"/>
    <text x="131.5" y="227" text-anchor="middle">Schliessen</text>
    <rect x="201" y="206" width="127" height="32" rx="6" fill="#171717"/>
    <text x="264.5" y="227" text-anchor="middle" fill="#fafafa">Speichern</text>
  </g>
</svg>
