<template data-component="InputOTP"><label for="verification-code">Verification code</label><p id="code-instructions">Enter the six digit code.</p><div data-input-otp-container><div aria-hidden="true" data-slot="input-otp-group"><div data-slot="input-otp-slot">1</div><div data-slot="input-otp-slot">2</div><div data-slot="input-otp-slot">3</div><div role="separator" aria-hidden="true"></div><div data-slot="input-otp-slot">4</div><div data-slot="input-otp-slot">5</div><div data-slot="input-otp-slot">6</div></div><input id="verification-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="^\d+$" value="123456" aria-invalid="true" aria-describedby="code-instructions code-error" data-slot="input-otp"></div><p id="code-error">The code expired. Request a new code.</p></template>
