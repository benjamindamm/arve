<template data-component="Slider"><div data-part="slider-field"><label data-part="slider-label" id="volume-label">Playback volume</label><div data-slot="slider" data-orientation="horizontal" aria-labelledby="volume-label"><div class="cn-slider" data-orientation="horizontal"><div data-slot="slider-track" data-orientation="horizontal"><div data-slot="slider-range" data-orientation="horizontal" style="position:relative;inset-inline-start:0px;width:calc(var(--ui-slider-thumb-size)/2 + (100% - var(--ui-slider-thumb-size))*0.4);height:inherit;"></div></div><div data-slot="slider-thumb" data-orientation="horizontal" data-index="0" style="--position:calc(var(--ui-slider-thumb-size)/2 + (100% - var(--ui-slider-thumb-size))*0.4);position:absolute;inset-inline-start:var(--position);top:50%;translate:-50% -50%;"><input type="range" min="0" max="100" step="5" value="40" aria-valuenow="40" aria-valuetext="40%" aria-orientation="horizontal" aria-labelledby="volume-label" aria-describedby="volume-help"/></div></div></div><p data-part="slider-help" id="volume-help">Percent from zero to one hundred.</p></div></template>
