name: design-system
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: design_system
      POSTGRES_USER: design_system
      POSTGRES_PASSWORD: local_design_system
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U design_system -d design_system']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
